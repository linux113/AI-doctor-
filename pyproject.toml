[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-doctor"
version = "0.2.0"
description = "AI Doctor - autonomous developer troubleshooting & recovery agent (DETECT -> DIAGNOSE -> FIX -> VERIFY -> RETRY) with read-only diagnostics and a strict remediation allowlist"
readme = "README.md"
requires-python = ">=3.9"

# Core runtime dependencies for the recovery agent (runner/, backend/, agent/).
# The previous list declared only the optional red-teaming packages and omitted
# everything the primary project actually imports, so `pip install -e .`
# produced an environment that could not run the agent at all.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",   # required by fastapi.testclient
]
# Optional medical-triage assistant (ai_doctor/) and DeepTeam red teaming.
# tests/test_ai_doctor.py skips cleanly when this extra is not installed.
redteam = [
    "deepteam",
    "deepeval>=1.0.0",
    "openai>=1.0.0",
    "sentry-sdk>=2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]
# AWS Strands Agents + Amazon Bedrock provider (AI_DOCTOR_AGENT_MODE=bedrock).
# Mirrors requirements-aws.txt. Not needed for deterministic offline mode, and
# not installed by `pip install -e .` so the core install stays lean.
# Both packages require Python >=3.10; the core runtime still supports 3.9.
aws = [
    "strands-agents>=1.56,<2",
    "boto3>=1.43,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
